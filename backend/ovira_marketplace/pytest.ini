[pytest]
# Unit tests for the money maths — no Frappe site required. Run from this
# directory with:  python -m pytest
#
# `tests/conftest.py` installs a minimal `frappe` stand-in only when the real one
# isn't importable, so the same suite runs unchanged inside a bench.
#
# Anything whose behaviour lives in the database (document hooks, permissions,
# submitted ERPNext vouchers, on_update transitions) is deliberately NOT here —
# see the note in conftest.py. Those belong in
#   bench --site <test-site> run-tests --app ovira_marketplace
testpaths = tests
python_files = test_*.py
addopts = -q
